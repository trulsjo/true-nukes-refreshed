# The checks that need no game (#69, from trulsjo/grado-factorio-tools#320): the commit messages,
# the mode of each .githooks/ file, the citations by line number and of commits off main (#73), the
# self-tests of the session hooks .claude/settings.json wires (#71), and the three checks of the
# four scripts scripts/load-check.ps1 runs before it starts Factorio. The fourth, the test
# scripts/tests/harness-lib.ps1, reads an install's data folder. It needs an install, and the load
# check itself and the port probes need the game, so they run only where a person starts them
# (docs/agents/checks.md). scripts/tests/ci-steps.ps1 holds the split: each script load-check.ps1
# runs before the game is a step here or on its list of scripts CI cannot run.
#
# The range is realistic-fusion-refreshed's gates.yml's: a pull request's base.sha..head.sha, and
# on a push to main the commits that push brought, since sessions commit to main directly. Neither
# reaches back into the Continued history, which the convention's check would fail. A pull request
# has at least one commit, so an empty range there fails (-RequireCommits). A push range can be
# empty, and a force-push to main can name a before commit the checkout lacks, which fails.
#
# Windows, because that is where every one of these scripts has passed, and asset-paths.ps1 finds a
# file whose name differs only in case there, as the game on Windows does.
#
# A second job checks a pull request's body (#73); its comment says how.
#
# Advisory: main has no branch protection, so a red check blocks nothing.
name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # The pull request's body, by the shared pr-body-check.ps1 with its default rules (#73): the pr
  # template's three headings and their markers, no commit cited that is not on main, and no
  # closing keyword outside a lone `Closes #N` line. `edited` is among the triggers so an edited
  # body is checked again, and the other job skips that event, so a body edit runs this alone. The
  # body reaches the script through the environment, never pasted into the command. The script
  # refuses a shallow clone. realistic-fusion-refreshed's gates.yml has the same job.
  body:
    name: Pull request body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0 # the check tells a commit on main from one that is not
      - name: pr-body-check.ps1
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./vendor/grado-factorio-tools/scripts/pr-body-check.ps1 -Body "$env:PR_BODY"

  check:
    if: github.event.action != 'edited'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit check walks a range
          submodules: true

      - name: Check the commit messages
        shell: pwsh
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || format('{0}..{1}', github.event.before, github.event.after) }}
          REQUIRE: ${{ github.event_name == 'pull_request' }}
        run: |
          $require = @{ RequireCommits = $env:REQUIRE -eq 'true' }
          & ./vendor/grado-factorio-tools/scripts/commit-check.ps1 -Range $env:RANGE @require -ScopeFile commit-scopes.txt

      # Off Windows git runs a hook only if its mode is 100755, and skips it silently otherwise.
      - name: Hold every .githooks/ file to mode 100755
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bad = @(git ls-files -s .githooks | Where-Object { $_ -notmatch '^100755 ' })
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bad | ForEach-Object { Write-Output "::error::not mode 100755: $_" }
          exit [int] [bool] $bad.Count

      - name: tests/asset-paths.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/asset-paths.ps1

      - name: tests/strict-lists.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/strict-lists.ps1

      - name: tests/script-help.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/script-help.ps1

      # A citation of this repository's own files by line number, which goes stale silently
      # (CLAUDE.md, Conventions), by the shared line-cite-check.ps1 over every tracked file (#73).
      # -Foreign passes a line quoting the game's own Lua error, `<file>.lua:<n>: attempt to ...`,
      # which names the line the game ran: before it, the one finding in the tree was such a
      # quote, in docs/research/2-1-api-changes.md. The floor is below the 3 path-and-line
      # citations the tree held then, so a matcher that stopped matching fails.
      - name: line-cite-check.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/line-cite-check.ps1 -Foreign '\.lua:\d+: attempt to ' -MinCitations 2

      # Each word of a tracked file that names a commit here names one origin/main reaches, so no
      # file cites a branch commit a rebase-merge rewrites (#73).
      - name: cited-commit-check.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/cited-commit-check.ps1

      # The session hooks .claude/settings.json wires from vendor/ (#71) refuse or warn in an agent
      # session and check nothing here, so their self-tests are the one place a change that breaks
      # one goes red. Each runs the command that file wires for it, so a wired command that no
      # longer reaches its script fails; the hanging-Bash one also fails where git does not ignore
      # its refusal log, .claude/refused-bash.log. The same step as realistic-fusion-refreshed's.
      - name: Session hooks' -SelfTest -Settings .claude/settings.json
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          foreach ($hook in 'ask-before-download', 'refuse-python-heredoc',
                  'refuse-backtick-substitution', 'refuse-hanging-bash', 'refuse-git-hook-skip',
                  'refuse-git-discard', 'refuse-pr-body', 'warn-skipped-install') {
            Write-Host "::group::$hook"
            pwsh -NoProfile -File "vendor/grado-factorio-tools/scripts/$hook.ps1" -SelfTest -Settings .claude/settings.json
            if ($LASTEXITCODE -ne 0) { $failed += $hook; Write-Host "::error::$hook failed" }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }

      # Each script load-check.ps1 runs before the game is a step above, or on ci-steps.ps1's list
      # of those CI cannot run.
      - name: tests/ci-steps.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/ci-steps.ps1
